services:
  # Dev database: schema + seed data. Talk to it with:
  #   docker compose exec db psql -U library -d library
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5440:5432"
    volumes:
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data

  # Test database: schema only, stored in memory, wiped every restart.
  # `go test ./...` truncates it before each test.
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library_test
    ports:
      - "5441:5432"
    volumes:
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
